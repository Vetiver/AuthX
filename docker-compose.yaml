version: '3.9'
services:
  authx:
    build:
      context: ./authX
    hostname: authX
    ports:
      - "8888:8080" 
    environment:
    - ProfilerAddr=0.0.0.0:6060
    - HTTP_PORT=8080
    - DATABASE_URL=postgres://authX_api_admin:qwe@postgresql-authx:5432/authX_api_bd?sslmode=disable
    - REDIS_ADDR=redis-authx:6379
    - REDIS_PASSWORD=
    - JWT_SECRET=local-dev-secret
    - JWT_ACCESS_TTL=15m
    - KAFKA_BROKERS=kafka:29092
    - KAFKA_AUTH_EVENTS_TOPIC=authx.auth.events
    - KAFKA_AUTH_EVENTS_DLQ_TOPIC=authx.auth.events.dlq
    - KAFKA_AUDIT_CONSUMER_GROUP=authx-audit-consumer
    - KAFKA_CLIENT_ID=authx
    - KAFKA_REQUIRED_ACKS=all

    volumes:
      - ./authX/:/app
    restart: always

  audit-consumer:
    build:
      context: ./authX
      dockerfile: Dockerfile.audit
    hostname: audit-consumer
    environment:
      - DATABASE_URL=postgres://authX_api_admin:qwe@postgresql-authx:5432/authX_api_bd?sslmode=disable
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_AUTH_EVENTS_TOPIC=authx.auth.events
      - KAFKA_AUTH_EVENTS_DLQ_TOPIC=authx.auth.events.dlq
      - KAFKA_AUDIT_CONSUMER_GROUP=authx-audit-consumer
    depends_on:
      - kafka
      - postgresql-authx
    restart: always
    
  postgresql-authx:
    image: library/postgres:13-alpine
    hostname: postgresql-authX
    ports:
      - 5449:5432
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - database_authx:/var/lib/postgresql/data
      - ./postgresql/sql_init/:/docker-entrypoint-initdb.d/
    restart: unless-stopped
    environment:
      - PGUSER=authX_api_admin
      - PGDATABASE=authX_api_bd
      - POSTGRES_HOST=postgresql-authx
      - POSTGRES_DB=authX_api_bd
      - POSTGRES_PORT=5432
      - POSTGRES_USER=authX_api_admin
      - POSTGRES_PASSWORD=qwe
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "authX_api_bd", "-U", "authX_api_admin" ]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-authx:
    image: redis:7-alpine
    hostname: redis-authX
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/redis/data
    restart: unless-stopped
    command: redis-server --appendonly yes --notify-keyspace-events Ex
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: "abcdefghijklmnopqrstuv"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  database_authx:
  redis_data:
  kafka_data: